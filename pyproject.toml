[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "group3lib"
version = "0.4.3"
description = "Python driver library for Group3 Technology digital teslameters (DTM-151-S and related)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Group3 Technology", email = "info@group3technology.com" },
]
keywords = ["group3", "teslameter", "dtm-151", "magnetometer", "serial", "rs-232", "g3cl"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: System :: Hardware",
  "Typing :: Typed",
]
# Core package has no required runtime dependencies. pyserial is an optional extra.
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
plot = ["matplotlib>=3.7"]
dev = [
  "pytest>=8",
  "mypy>=1.10",
  "ruff>=0.6",
]
all = ["group3lib[serial,plot,dev]"]

[project.urls]
Homepage = "https://github.com/Group3-Technology/group3lib"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
group3 = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "N",    # pep8-naming
  "SIM",  # flake8-simplify
]
ignore = [
  "E501",  # line length (handled by formatter where appropriate)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]  # allow test function naming

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_any_generics = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "serial"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "serial.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
